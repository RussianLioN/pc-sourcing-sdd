schema_version: "1.0"
workflow:
  id: "pc-independent-verifier"
  name: "Actual independent read-only Codex snapshot review"
  version: "1.0.0"
steps:
  - id: verify
    type: prompt
    integration: codex
    prompt: |
      Independently verify this integrated pc-sourcing-sdd snapshot.
      You are a fresh read-only verifier, not the writer or coordinator.
      Read AGENTS.md, constitution, spec, plan, golden corpus, source code,
      and both pc-payment-audit and pc-snapshot-check SKILL.md explicitly.
      Verify intended eligibility/payment/provenance, invalid input preservation,
      DB/report consistency, idempotency, failure recovery limits and scope gate.
      Run actual tests using project interpreter with PYTHONDONTWRITEBYTECODE=1,
      PYTHONPATH=src .venv/bin/python -m pytest -q -p no:cacheprovider
      --basetemp="$TMPDIR/pytest"; .venv/bin/ruff check --no-cache .;
      .venv/bin/ruff format --check --no-cache .
      Use only assigned temporary directory for any reproducers. Do not edit
      code, tests, golden, spec, tasks or Git. Do not delegate, use network,
      external tools, new credentials, purchases or publishing.
      For the integrated snapshot run .venv/bin/python scripts/verify_scope.py tasks/T002.json .
      T001/T003 and T006 are historical writer scopes, not common-snapshot tasks.
      Use T002 for coordinator plus integration changes. Original goldens/contracts
      remain byte-protected; original test behavior is AST-protected against baseline.
      Review docs/defects.md and tests/test_review_regressions.py; reproduce fixed
      defects independently in scratch and report any remaining in-scope violation.
      Read tasks/continuation-policy.json: the user explicitly superseded the
      historical two-round stop. Product requirements and original goldens
      are unchanged. T002 pins only the authorized constitution revision to
      a new coordinator Git blob; all other original protected baselines stay.
      Review the Unicode regression/property tests. Reproduce DEF-006 and the
      broader invalid row class in scratch: high/low/reversed surrogate text
      in stored fields/keys/nesting, rejected raw and readable diagnostics,
      valid Cyrillic/emoji/pairs, two valid neighbors whose data/Evaluation
      are unchanged. Malformed document encoding/framing is a whole-source
      error with unknown boundaries; never guess recovery. SQLite failures
      must remain transaction failures, not arbitrary row rejections.
      Inspect real collector-loop-final receipt and saved runner state for
      two actual passes and condition exit on this same SHA. Converge is
      optional; no parallel fan-out is claimed. Scope is offline pilot only.
      Return JSON as final response: {"verdict":"passed|failed|blocked",
      "commit":"exact git rev-parse HEAD", "checks":[{"command":"...",
      "exit_code":0}], "findings":[{"severity":"...", "file":"...",
      "reason":"...", "reproducer":"..."}], "limitations":["..."]}.
      Describe material defects with evidence, not speculative unrelated scope.
      Do not declare passed when required checks could not run. 600s limit.
